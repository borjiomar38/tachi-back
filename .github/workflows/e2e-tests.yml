name: 🧪 E2E Tests
on:
  push:
    branches:
      - master
      - main
      - develop
      - staging
  pull_request:

jobs:
  E2E:
    name: E2E (${{ matrix.browser }})
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      VITE_BASE_URL: http://localhost:3000
      VITE_PORT: 3000
      VITE_ENV_NAME: tests
      DATABASE_URL: postgres://startui:startui@localhost:5432/startui
      VITE_IS_DEMO: false
      AUTH_SECRET: fyXjLxjXJowjicI2BAjxOaUsQd1QafdegZDciJE/xM8=
      EMAIL_SERVER: smtp://username:password@localhost:1025
      EMAIL_FROM: Start UI <noreply@example.com>
      S3_HOST: localhost:9000
      S3_BUCKET_NAME: default
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: test
      S3_SECURE: false
      S3_FORCE_PATH_STYLE: true
      VITE_S3_BUCKET_PUBLIC_URL: http://localhost:9000/default
    services:
      postgres:
        image: postgres:16.1

        env:
          POSTGRES_PASSWORD: startui
          POSTGRES_USER: startui
          POSTGRES_DB: startui

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      maildev:
        image: maildev/maildev:2.2.1
        options: >-
          --health-cmd "wget --spider --no-verbose --tries=1 -T 3 http://localhost:1080/healthz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 1025:1025
          - 1080:1080

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: 22

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium ${{ matrix.browser }}

      - name: Start LocalStack S3
        run: |
          docker run -d \
            --name localstack \
            -p 9000:4566 \
            -e SERVICES=s3 \
            localstack/localstack:4.14.0

          until curl -sf http://localhost:9000/_localstack/health \
            | jq -e '.services.s3 == "available" or .services.s3 == "running"' >/dev/null; do
            echo "Waiting for LocalStack S3..."
            sleep 2
          done
          echo "LocalStack S3 is ready"

      - name: Setup S3 bucket
        run: |
          docker exec localstack awslocal s3api create-bucket \
            --bucket "$S3_BUCKET_NAME"
          docker exec localstack awslocal s3api put-public-access-block \
            --bucket "$S3_BUCKET_NAME" \
            --public-access-block-configuration \
            BlockPublicAcls=false,IgnorePublicAcls=false,BlockPublicPolicy=false,RestrictPublicBuckets=false
          docker exec localstack awslocal s3api put-bucket-policy \
            --bucket "$S3_BUCKET_NAME" \
            --policy '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":"*","Action":"s3:GetObject","Resource":"arn:aws:s3:::default/*"}]}'

      - name: Migrate database
        run: pnpm db:migrate:deploy

      - name: Add default data into database
        run: pnpm db:seed

      - name: Run Playwright tests
        run: pnpm exec playwright test --project=${{ matrix.browser }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30
